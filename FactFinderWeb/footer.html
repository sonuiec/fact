<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9px;
        margin: 0;
        padding: 0;
    }

    .footer {
        width: 100%;
        border-top: 1px solid #cfd8e3;
        padding-top: 4px;
    }

    .company {
        text-align: center;
        font-weight: bold;
        margin-bottom: 4px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    td {
        vertical-align: middle;
        white-space: nowrap;
    }

    .right {
        text-align: right;
    }

    img {
        height: 10px;
        vertical-align: middle;
        margin-right: 4px;
    }
</style>
</head>

<body>
    <div class="footer">
        <div class="company">
            Mainstream Investments Services Pvt. Ltd., Unit No-1003, 10th Floor,
            Noida One, Sector-62 Noida-201306
        </div>

        <table>
            <tr>
                <td>
                    <img src="https://ff.mainstream.co.in/images/icons/phone.png" />
                    +91-93542 68360, 98113 33637
                </td>

                <td>
                    <img src="https://ff.mainstream.co.in/images/icons/email.png" />
                    advisor@mainstream.co.in
                </td>

                <td>
                    <img src="https://ff.mainstream.co.in/images/icons/web.png" />
                    www.mainstream.co.in
                </td>

                <td class="right">
                    Page [page] of [toPage]
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
