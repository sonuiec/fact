<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>
        Forgot Password Request
    </title>
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #f5f7fb; padding: 24px; color: #4b5563; font-size: 14px; ">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 670px; background: #ffffff; margin: auto;">

        <tr>
            <td>
                <img src="https://ff.mainstream.co.in/images/header.jpg"
                     alt="AWAKEN Fact Finder"
                     width="600"
                     style="display: block; width: 100%; max-width: 670px; border: 0;" />
            </td>
        </tr>

        <tr>
            <td style="  padding: 18px 24px 8px;">
                <div style="padding: 20px; border-radius: 8px;">


                    <h2 style="color: #333;">
                        Forgot Password Request
                    </h2>
                    <p>Hi {{UserName}},</p>
                    <p>
                        We received a request to retrieve your password.
                    </p>
                    <p>
                        This is your password: {{Password}}
                    </p>
                    <p>If you didn’t request this, you can safely ignore this email.</p>

                    <p>Thanks,</p>
                    <p>Team - Awaken - Fact Finder</p>
                </div>



            </td>
        </tr>
    </table>
</body>
</html>
